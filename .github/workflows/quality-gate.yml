name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Type, Lint, Style, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static-analysis contract
        run: npm run static-analysis:contract

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Accessibility lint (strict jsx-a11y)
        run: npx eslint --config eslint.a11y.config.js "src/**/*.tsx" --max-warnings=0

      - name: Format check
        run: npm run format:check

      - name: Style check (Impeccable — opt-in)
        run: npm run style:check

      - name: Build
        run: npm run build
