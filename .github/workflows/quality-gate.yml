name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's "packageManager" field —
      # keep that field as the single source of truth, don't also pin a version here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single canonical check — guard rails, types, lint, a11y, format, style,
      # react-doctor, build. Same command developers run locally and pre-commit
      # runs a staged-files-scoped version of. See package.json's check:* scripts.
      - name: Verify
        run: pnpm run verify
