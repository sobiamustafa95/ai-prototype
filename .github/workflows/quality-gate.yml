name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's "packageManager" field —
      # keep that field as the single source of truth, don't also pin a version here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Static-analysis contract
        run: pnpm static-analysis:contract

      - name: Type check
        run: pnpm check:types

      - name: Lint
        run: pnpm check:lint

      - name: Accessibility lint (strict jsx-a11y)
        run: pnpm check:a11y

      - name: Format check
        run: pnpm check:format

      - name: Style check (Impeccable — opt-in)
        run: pnpm check:style

      # Single canonical check — guard rails, types, tests, lint, a11y, format,
      # style, react-doctor, build. Same command developers run locally; the
      # pre-commit hook runs a staged-files-scoped subset for commit speed.
      - name: Verify
        run: pnpm verify
